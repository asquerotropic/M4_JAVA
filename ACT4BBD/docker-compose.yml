services:
  postgres:
    build: ./DBconfiguration #AQUÍ INDICAMOS QUE SE VA A CONSTRUIR EL CONTENEDOR
    container_main: base_datos_tramites #NOMBRE DEL CONTENEDOR
    ports:
      - "5432:5432"
    enviroment:
      - POSTGRES_USER: admin
      - POSTGRES_PASSWORD: password123
      - POSTGRES_DB: sistema_tramites
    volumes: #GUARDAMOS EL PROYECTO EN LA CARPETA, EN CASO DE QUE TENGA ALGUNA FALLA 
      - postgres_data: /var/lib/postgres/data
volumes: #LA INFORMACIÓN SE VA ALMACENAR EN EL LOCAL (PUEDE INDICARSE ALGUNA RUTA EN C)
  - postgres_data:
      drive: local